<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Feedback Admin · salary:converter</title>
<style>
:root{--bg:#f4eee2;--card-bg:#fcf9f2;--text-primary:#1d1d1f;--text-secondary:#86868b;--text-body:#4a4a4c;--accent:#2563eb;--border:#e5e5ea;--border-light:#f0f0f2}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card-bg:#1c1c1e;--text-primary:#f5f5f7;--text-secondary:#98989f;--text-body:#b0b0b5;--accent:#3b82f6;--border:#38383a;--border-light:#2c2c2e}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.5;-webkit-font-smoothing:antialiased;padding:24px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
h1{font-size:1.4rem;font-weight:700;letter-spacing:-.3px}
.muted{color:var(--text-secondary);font-size:.85rem}
.token-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.token-row input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-primary);font-family:inherit;font-size:.85rem;min-width:240px}
.token-row button{padding:8px 16px;border:none;background:var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.token-row button:hover{opacity:.9}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kpi{flex:1;min-width:140px;background:var(--card-bg);border:1px solid var(--border-light);border-radius:12px;padding:14px 18px}
.kpi .lab{font-size:.7rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi .val{font-size:1.4rem;font-weight:700;color:var(--text-primary)}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-row select,.filter-row input{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-primary);font-family:inherit;font-size:.82rem}
table{width:100%;border-collapse:collapse;background:var(--card-bg);border:1px solid var(--border-light);border-radius:12px;overflow:hidden;font-size:.85rem}
th{text-align:left;padding:10px 12px;background:var(--bg);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border-light);color:var(--text-body);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.r-1{background:rgba(220,38,38,.04)}
tr.r-2{background:rgba(245,158,11,.04)}
.stars{color:#f59e0b;letter-spacing:1px;white-space:nowrap;font-size:.95rem}
.tool-pill{display:inline-block;padding:2px 8px;background:var(--bg);border-radius:100px;font-size:.7rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px}
.comment{max-width:480px;color:var(--text-primary);white-space:pre-wrap;word-break:break-word}
.empty{padding:60px 20px;text-align:center;color:var(--text-secondary)}
.error{padding:14px 18px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:10px;color:#dc2626;margin-bottom:14px;font-size:.88rem}
.refresh{background:none!important;color:var(--text-secondary)!important;border:1px solid var(--border)!important}
@media(max-width:600px){body{padding:12px}.summary{flex-direction:column}td,th{padding:8px 8px;font-size:.78rem}.comment{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Feedback</h1>
      <p class="muted">Submissions from the tool feedback widget. Newest first.</p>
    </div>
    <div class="token-row">
      <input id="token" type="password" placeholder="Admin token" autocomplete="current-password">
      <button id="loadBtn">Load</button>
      <button id="refreshBtn" class="refresh" title="Refresh">⟳</button>
    </div>
  </header>

  <div id="error" class="error" style="display:none"></div>

  <div class="summary" id="summary" style="display:none">
    <div class="kpi"><div class="lab">Total</div><div class="val" id="kpiTotal">—</div></div>
    <div class="kpi"><div class="lab">Avg rating</div><div class="val" id="kpiAvg">—</div></div>
    <div class="kpi"><div class="lab">With comment</div><div class="val" id="kpiComment">—</div></div>
    <div class="kpi"><div class="lab">Last 7 days</div><div class="val" id="kpiRecent">—</div></div>
  </div>

  <div class="filter-row" id="filterRow" style="display:none">
    <select id="fTool"><option value="">All tools</option></select>
    <select id="fRating">
      <option value="">All ratings</option>
      <option value="5">5 stars</option>
      <option value="4">4 stars</option>
      <option value="3">3 stars</option>
      <option value="2">2 stars</option>
      <option value="1">1 star</option>
    </select>
    <input id="fSearch" type="search" placeholder="Search comment / name…">
  </div>

  <div id="tableHost"></div>
</div>

<script>
(function(){
  var $token = document.getElementById('token');
  var $loadBtn = document.getElementById('loadBtn');
  var $refreshBtn = document.getElementById('refreshBtn');
  var $err = document.getElementById('error');
  var $summary = document.getElementById('summary');
  var $filterRow = document.getElementById('filterRow');
  var $host = document.getElementById('tableHost');
  var $fTool = document.getElementById('fTool');
  var $fRating = document.getElementById('fRating');
  var $fSearch = document.getElementById('fSearch');

  var entries = [];

  // Persist token locally so reloads don't require re-typing
  var savedToken = localStorage.getItem('fbAdminToken');
  if (savedToken) $token.value = savedToken;

  function showError(msg) {
    $err.textContent = msg;
    $err.style.display = msg ? 'block' : 'none';
  }

  function load() {
    var token = $token.value.trim();
    if (!token) { showError('Enter the admin token to view feedback.'); return; }
    localStorage.setItem('fbAdminToken', token);
    showError('');
    $loadBtn.disabled = true; $loadBtn.textContent = 'Loading…';
    fetch('/api/feedback-list?token=' + encodeURIComponent(token) + '&limit=1000')
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; }); })
      .then(function(res){
        if (!res.ok) {
          showError(res.body && res.body.error ? res.body.error : ('HTTP ' + res.status));
          return;
        }
        entries = res.body.entries || [];
        render();
      })
      .catch(function(e){ showError('Network error: ' + e.message); })
      .finally(function(){ $loadBtn.disabled = false; $loadBtn.textContent = 'Load'; });
  }

  function fmtStars(n) {
    var s = '';
    for (var i = 0; i < 5; i++) s += i < n ? '★' : '☆';
    return s;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function render() {
    if (!entries.length) {
      $summary.style.display = 'none';
      $filterRow.style.display = 'none';
      $host.innerHTML = '<div class="empty">No feedback yet. Submissions will appear here.</div>';
      return;
    }

    $summary.style.display = '';
    $filterRow.style.display = '';

    // KPIs
    var total = entries.length;
    var avg = entries.reduce(function(a,e){ return a + (e.rating||0); }, 0) / total;
    var withComment = entries.filter(function(e){ return e.comment && e.comment.trim(); }).length;
    var weekAgo = Date.now() - 7*24*60*60*1000;
    var recent = entries.filter(function(e){ return new Date(e.ts).getTime() > weekAgo; }).length;
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiAvg').textContent = avg.toFixed(2);
    document.getElementById('kpiComment').textContent = withComment;
    document.getElementById('kpiRecent').textContent = recent;

    // Tool filter options
    var tools = {};
    entries.forEach(function(e){ if (e.tool) tools[e.tool] = true; });
    var prevTool = $fTool.value;
    $fTool.innerHTML = '<option value="">All tools</option>' + Object.keys(tools).sort().map(function(t){
      return '<option value="' + escapeHtml(t) + '"' + (t === prevTool ? ' selected' : '') + '>' + escapeHtml(t) + '</option>';
    }).join('');

    // Filter
    var ft = $fTool.value, fr = $fRating.value, fs = $fSearch.value.toLowerCase().trim();
    var rows = entries.filter(function(e){
      if (ft && e.tool !== ft) return false;
      if (fr && String(e.rating) !== fr) return false;
      if (fs) {
        var hay = ((e.comment||'') + ' ' + (e.name||'')).toLowerCase();
        if (hay.indexOf(fs) === -1) return false;
      }
      return true;
    });

    if (!rows.length) {
      $host.innerHTML = '<div class="empty">No matches with current filters.</div>';
      return;
    }

    var html = ['<table>',
      '<thead><tr>',
      '<th>When</th><th>Rating</th><th>Tool</th><th>Comment</th><th>Name</th><th>From</th>',
      '</tr></thead><tbody>'];
    rows.forEach(function(e){
      var d = new Date(e.ts);
      var when = d.toLocaleString(undefined, {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      var loc = [e.city, e.country].filter(Boolean).join(', ');
      html.push('<tr class="r-' + e.rating + '">');
      html.push('<td>' + escapeHtml(when) + '</td>');
      html.push('<td><span class="stars" title="' + e.rating + '/5">' + fmtStars(e.rating) + '</span></td>');
      html.push('<td><span class="tool-pill">' + escapeHtml(e.tool || '—') + '</span></td>');
      html.push('<td><div class="comment">' + escapeHtml(e.comment || '') + '</div></td>');
      html.push('<td>' + escapeHtml(e.name || '') + '</td>');
      html.push('<td>' + escapeHtml(loc) + '</td>');
      html.push('</tr>');
    });
    html.push('</tbody></table>');
    $host.innerHTML = html.join('');
  }

  $loadBtn.addEventListener('click', load);
  $refreshBtn.addEventListener('click', load);
  $token.addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
  $fTool.addEventListener('change', render);
  $fRating.addEventListener('change', render);
  $fSearch.addEventListener('input', function(){ clearTimeout(window.__fbT); window.__fbT = setTimeout(render, 200); });

  // Auto-load if a token is saved
  if (savedToken) load();
})();
</script>
</body>
</html>
